[package]
name = "odir"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Ollama Downloader in Rust (ODIR), pronounced oh dear, is a command-line tool written in Rust for downloading models from Ollama."
repository = "https://github.com/anirbanbasu/odir"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["blocking", "json", "rustls", "stream"], default-features = false }
scraper = "0.27"
thiserror = "2.0"
sha2 = "0.11"
indicatif = "0.18"
tempfile = "3.25"
regex = "1.12"
directories = "6.0"
libc = "0.2"
signal-hook = "0.4"
crossterm = "0.29"
url = "2.5.8"
hex = "0.4"
chrono = "0.4"

[dev-dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
