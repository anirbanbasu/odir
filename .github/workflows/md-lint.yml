name: Markdown Lint

permissions:
    contents: read
    pull-requests: write
on:
    push:
        branches:
            - master
            - develop
            - release/*
    pull_request:
    merge_group:
    workflow_dispatch:
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
              with:
                  egress-policy: audit

            - name: Set up Git repository
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Lint
              uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
              with:
                  globs: |
                      README.md,
                      CONTRIBUTING.md,
                      CONTRIBUTORS.md,
                      docs/**/*.md
                      docs/decisions/0000-use-markdown-architectural-decision-records.md
                      docs/decisions/adr-template-minimal.md
                      docs/decisions/adr-template.md
                      docs/decisions/README.md
    changelog:
        name: CHANGELOG.md
        runs-on: ubuntu-latest
        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
              with:
                  egress-policy: audit

            - name: Checkout source
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - name: Lint CHANGELOG.md
              run: |
                  # Install jbang
                  curl -Ls https://raw.githubusercontent.com/jbangdev/jbang/4bcb11945c968cdcb9b1f8a75f246dbc4d00633b/src/main/scripts/jbang | bash -s - app setup
                  export PATH=$PATH:$HOME/.jbang/bin

                  # run heylogs verification
                  jbang com.github.nbbrd.heylogs:heylogs-cli:0.9.2:bin check CHANGELOG.md > heylogs.txt || true

                  # improve output
                  # sed -i 's/all-h2-contain-a-version/all-h2-contain-a-version (ignored)/' heylogs.txt

                  cat heylogs.txt

                  # exit 1 in case of error
                  grep -q "No problem" heylogs.txt || exit 1
