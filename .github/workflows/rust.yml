# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
name: Rust tests

permissions:
    contents: read
    pull-requests: write
on:
    push:
        branches: ["master"]
        paths:
            - "**/*.rs"
            - "**/Cargo.toml"
            - "**/Cargo.lock"
    pull_request:
        branches: ["master"]
        paths:
            - "**/*.rs"
            - "**/Cargo.toml"
            - "**/Cargo.lock"

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Harden the runner (Audit all outbound calls)
              uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
              with:
                  egress-policy: audit

            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Type check and lint
              # Treat all warnings as errors
              run: cargo clippy -- -D warnings
            - name: Build
              run: cargo build --verbose
            # Setting up Ollama is not required since the minimal tests do not require it.
            # - name: Setup Ollama
            #   # Ollama is required for model download tests, which are set to be ignored by default
            #   uses: ai-action/setup-ollama@8dace3eab22ce4d761427bb75f8f70f1270ea660 # v2.0.25
            - name: Run minimal tests
              run: cargo test -- --test-threads=1
